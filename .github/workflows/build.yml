name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack project.zip (if uploaded as a single zip file)
        run: |
          if [ -f "project.zip" ]; then
            echo "Found project.zip! Extracting all project files..."
            unzip -o project.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK (ARMv7a + ARM64-v8a Universal)
        run: gradle assembleDebug --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatingMediaBubble-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
